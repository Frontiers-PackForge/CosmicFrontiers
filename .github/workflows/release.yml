name: CurseForge Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: Release tag to simulate, such as 0.8.0-nightly.001+1.21.1
        required: true
        type: string
      build_server_pack:
        description: Build the full CurseForge server archive
        required: true
        default: true
        type: boolean

concurrency:
  group: cosmic-frontiers-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      game_version: ${{ steps.release.outputs.game_version }}
      loader: ${{ steps.release.outputs.loader }}
      loader_version: ${{ steps.release.outputs.loader_version }}
      release_version: ${{ steps.release.outputs.release_version }}
      display_version: ${{ steps.release.outputs.display_version }}
      client_archive: ${{ steps.release.outputs.client_archive }}
      server_archive: ${{ steps.release.outputs.server_archive }}
      curseforge_version_type: ${{ steps.release.outputs.curseforge_version_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: pip install --requirement scripts/requirements.txt

      - name: Build and validate release archives
        id: release
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.release_version }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          BUILD_SERVER_PACK: ${{ github.event_name == 'workflow_dispatch' && inputs.build_server_pack || github.event_name == 'release' }}
        run: python scripts/release.py

      - name: Upload validated build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ steps.release.outputs.release_version }}
          path: |
            ${{ steps.release.outputs.client_archive }}
            ${{ (github.event_name == 'release' || inputs.build_server_pack) && steps.release.outputs.server_archive || '' }}
          if-no-files-found: error
          retention-days: 7

      - name: Report manual server upload artifact
        if: ${{ github.event_name == 'release' || inputs.build_server_pack }}
        shell: bash
        run: |
          {
            echo "### Manual CurseForge server upload"
            echo "Download artifact \`build-artifacts-${{ steps.release.outputs.release_version }}\`."
            echo "Upload \`${{ steps.release.outputs.server_archive }}\` as the server-pack additional file in CurseForge."
          } >> "$GITHUB_STEP_SUMMARY"

  upload-release-artifact:
    name: Upload client archive to GitHub release
    needs: build
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.build.outputs.release_version }}

      - name: Upload client archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_version }}
          files: ./${{ needs.build.outputs.client_archive }}
          fail_on_unmatched_files: true

  publish-curseforge:
    name: Publish client archive to CurseForge
    needs: build
    if: ${{ github.event_name == 'release' && github.repository_owner == 'Frontiers-PackForge' && !startsWith(github.event.release.name, 'simulate') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.build.outputs.release_version }}

      - name: Upload to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          curseforge-id: ${{ vars.CURSE_ID }}
          curseforge-token: ${{ secrets.CURSE_TOKEN }}
          files: ./${{ needs.build.outputs.client_archive }}
          name: Cosmic Frontiers ${{ needs.build.outputs.display_version }}
          version: ${{ needs.build.outputs.release_version }}
          changelog: ${{ github.event.release.body }}
          version-type: ${{ needs.build.outputs.curseforge_version_type }}
          loaders: ${{ needs.build.outputs.loader }}
          game-versions: ${{ needs.build.outputs.game_version }}
