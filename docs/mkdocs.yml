site_name: Cosmic Frontiers Wiki
site_url: https://cosmicfrontiers.github.io/CosmicFrontiers

repo_name: CosmicFrontiers
repo_url: https://github.com/Frontiers-PackForge/CosmicFrontiers
edit_uri: blob/main-1.20.1-Forge/docs/content/

docs_dir: content

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.code.annotate
    - content.action.view

plugins:
  - search
  - awesome-pages

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/fkxPAq9VQp
    - icon: simple/curseforge
      link: https://curseforge.com/minecraft/modpacks/cosmic-frontiers
    - icon: fontawesome/brands/github
      link: https://github.com/Frontiers-PackForge/CosmicFrontiers

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - md_in_html
  - pymdownx.betterem
  - pymdownx.caret:
      insert: false
  - pymdownx.tilde:
      delete: false
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
